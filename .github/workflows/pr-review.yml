---
name: PR Review by OpenHands

on:
    pull_request:
        types: [review_requested]

permissions:
    contents: read
    pull-requests: write

jobs:
    pr-review:
        if: github.event.requested_reviewer.login == 'mizzenbot'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Run PR Review
              uses: OpenHands/extensions/plugins/pr-review@279ece7e6e678dc1edee98da75a2cf05df2dbfa3
              with:
                  extensions-version: 279ece7e6e678dc1edee98da75a2cf05df2dbfa3
                  llm-model: openrouter/openai/gpt-5.6-terra
                  llm-base-url: ${{ secrets.LLM_BASE_URL }}
                  llm-api-key: ${{ secrets.LLM_API_KEY }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
