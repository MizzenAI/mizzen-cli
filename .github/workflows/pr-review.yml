name: PR Review by OpenHands

on:
  pull_request:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    # Public repos cannot call a private reusable workflow. Reuse its pinned
    # runner instead; never expose review credentials to fork pull requests.
    if: github.event.requested_reviewer.login == 'mizzenbot' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check existing review for current commit
        id: check-review
        env:
          GH_TOKEN: ${{ secrets.MIZZENBOT_GITHUB_PAT }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate |
            jq -s --arg head "$HEAD_SHA" '[.[][] | select(
              .user.login == "mizzenbot" and .commit_id == $head and
              (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "COMMENTED")
            )] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.check-review.outputs.count == '0'
        with:
          repository: MizzenAI/gh-actions
          ref: 89012d8455439262a3105f7ea7353abcd52699fc
          path: workflow-source
          token: ${{ secrets.MIZZENBOT_GITHUB_PAT }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.check-review.outputs.count == '0'
        with:
          repository: OpenHands/extensions
          ref: 279ece7e6e678dc1edee98da75a2cf05df2dbfa3
          path: extensions
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.check-review.outputs.count == '0'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr-repo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.check-review.outputs.count == '0'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        if: steps.check-review.outputs.count == '0'
        with:
          enable-cache: false
      - name: Run PR Review
        if: steps.check-review.outputs.count == '0'
        env:
          UV_INDEX_URL: https://pypi.org/simple
          UV_NO_CONFIG: "true"
          UV_PYTHON: "3.12"
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          OPENHANDS_SDK_PACKAGE: openhands-sdk==1.35.0,openhands-tools==1.34.0,fastmcp==3.4.4,lmnr==0.7.52,fastapi==0.139.0,litellm==1.93.0
          BEDROCK_PR_REVIEW_API_KEY: ${{ secrets.BEDROCK_PR_REVIEW_API_KEY }}
          LLM_MODEL_INPUT: openai/us.openai.gpt-5.6-terra
          GITHUB_TOKEN: ${{ secrets.MIZZENBOT_GITHUB_PAT }}
          GH_TOKEN: ${{ secrets.MIZZENBOT_GITHUB_PAT }}
          EXTENSIONS_COMMIT: 279ece7e6e678dc1edee98da75a2cf05df2dbfa3
          EXTENSIONS_DIR: ${{ github.workspace }}/extensions
          PR_REPO_DIR: ${{ github.workspace }}/pr-repo
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO_NAME: ${{ github.repository }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_STYLE: roasted
          USE_SUB_AGENTS: "false"
          LOAD_PUBLIC_SKILLS: "true"
          REQUIRE_EVIDENCE: "false"
          COLLECT_FEEDBACK: "false"
        run: bash workflow-source/scripts/run-pr-review.sh
